<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Story 3D</title>

    <link rel="stylesheet" href="style.css?v=1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#003355">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="cabinet">
    <div id="topMarquee">
        SEA STORY 3D
    </div>

        <div class="sideDecor left">🐚</div>
    <div class="sideDecor right">🐚</div>

    <!-- 🌊 3D 영역 -->
    <div id="oceanArea"></div> 

    <!-- 🎰 SLOT 영역 -->
    <div id="slotArea">
        <div id="slotPanel">

            <div class="slot-header">✨ SEA STORY JACKPOT ✨</div>

            <div class="slot-grid">

                <div class="col" id="col1">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col2">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col3">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col4">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

            </div>

            <!-- 🎯 SPIN CONTROL BAR (핵심 UI) -->
            <div id="spinBar">

                <!-- 💰 LEFT: SCORE -->
                <div id="scoreUI" class="spin-info">
                    SCORE: 0
                </div>

                <!-- 🎰 CENTER: BUTTON -->
                <button id="spinBtn">SPIN</button>

                <!-- 🎟 RIGHT: SPIN COUNT -->
                <div id="spinUI" class="spin-info">
                    SPIN: 0
                </div>

            </div>

        </div>
    </div>

    <!-- ✨ BONUS EVENT -->
    <div id="bonusEvent">
        <div id="bonusTitle">✨ BONUS ✨</div>
        <div id="bonusName"></div>
    </div>

</div>

<script type="module" src="main.js"></script>

</body>
</html>
