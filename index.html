<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Story 3D</title>

    <!-- 🌊 CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 📱 PWA MANIFEST -->
    <link rel="manifest" href="manifest.json">

    <!-- 🍎 iOS 아이콘 -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- 🎨 테마 컬러 -->
    <meta name="theme-color" content="#000000">

    <!-- 📱 모바일 앱 모드 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- 🚀 THREE IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="cabinet">

    <!-- 🌊 3D 영역 -->
    <div id="oceanArea"></div>

    <!-- 🎰 SLOT 영역 -->
    <div id="slotArea">
        <div id="slotPanel">

            <div class="slot-header">✨ SEA STORY JACKPOT ✨</div>

            <div class="slot-grid">

                <div class="col" id="col1">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col2">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col3">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="col" id="col4">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

            </div>

            <!-- 🎯 SPIN CONTROL BAR -->
            <div id="spinBar">

                <div id="scoreUI" class="spin-info">
                    SCORE: 0
                </div>

                <button id="spinBtn">SPIN</button>

                <div id="spinUI" class="spin-info">
                    SPIN: 0
                </div>

            </div>

        </div>
    </div>

    <div id="topNotice"></div>
    <!-- ✨ BONUS EVENT -->
    <div id="bonusEvent">
        <div id="bonusTitle">✨ BONUS ✨</div>
        <div id="bonusName"></div>
    </div>
    <div id="bottomNotice">
  <div class="ticker">
    <span class="hot">🎯 SCORE 100만 달성 시 업비트 자동매매(년간용) 프로그램 증정!</span>
    <!-- <span>💰 보너스 타임 진행 중!</span> -->
    <span>🐋 대형 이벤트 등장 확률 상승!</span>
    <span class="event">🔥 매일 이벤트 진행중!</span>

  </div>
</div>
    
</div>

</div>

<!-- 🎉 SCORE EVENT POPUP -->
<div id="scoreEventPopup" class="score-event-popup">

    <div class="score-event-box">

        <h2 id="eventTitle">🎉 이벤트 당첨!</h2>

        <p id="eventMessage"></p>

        <input
            id="eventName"
            type="text"
            placeholder="이름">

        <input
            id="eventPhone"
            type="tel"
            placeholder="전화번호">

        <button id="eventSubmit">
            이벤트 신청
        </button>

    </div>

</div>

<script type="module" src="main.js"></script>

</body>
</html>
